# CSCAN 一体化部署
# 启动前必须创建 .env 并为所有凭据设置强随机值：cp .env.example .env。
# Mongo / Redis 端口不对外发布，仅 cscan_network 内部可达；API 端口仍须由外部访问控制保护。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # Redis
  redis:
    image: registry.cn-hangzhou.aliyuncs.com/txf7/redis:7-alpine
    container_name: cscan_redis
    command: redis-server --appendonly yes --requirepass ${CSCAN_REDIS_PASSWORD:?CSCAN_REDIS_PASSWORD must be set}
    logging: *default-logging
    volumes:
      - cscan_redis_data:/data
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - cscan_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${CSCAN_REDIS_PASSWORD:?CSCAN_REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # MongoDB
  mongodb:
    image: registry.cn-hangzhou.aliyuncs.com/txf7/mongo:6
    container_name: cscan_mongodb
    logging: *default-logging
    volumes:
      - cscan_mongodb_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      - TZ=Asia/Shanghai
      - MONGO_INITDB_DATABASE=cscan
      - MONGO_INITDB_ROOT_USERNAME=${CSCAN_MONGO_ROOT_USERNAME:?CSCAN_MONGO_ROOT_USERNAME must be set}
      - MONGO_INITDB_ROOT_PASSWORD=${CSCAN_MONGO_ROOT_PASSWORD:?CSCAN_MONGO_ROOT_PASSWORD must be set}
    restart: unless-stopped
    networks:
      - cscan_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # CSCAN API 服务
  cscan-api:
    image: registry.cn-hangzhou.aliyuncs.com/txf7/cscan-api:latest
    container_name: cscan_api
    logging: *default-logging
    environment:
      - TZ=Asia/Shanghai
      - CSCAN_MONGO_URI=mongodb://${CSCAN_MONGO_ROOT_USERNAME:?CSCAN_MONGO_ROOT_USERNAME must be set}:${CSCAN_MONGO_ROOT_PASSWORD:?CSCAN_MONGO_ROOT_PASSWORD must be set}@mongodb:27017/cscan?authSource=admin
      - CSCAN_MONGO_DB=cscan
      - CSCAN_REDIS_HOST=redis:6379
      - CSCAN_REDIS_PASSWORD=${CSCAN_REDIS_PASSWORD:?CSCAN_REDIS_PASSWORD must be set}
      - CSCAN_JWT_SECRET=${CSCAN_JWT_SECRET:?CSCAN_JWT_SECRET must be set}
      - CSCAN_WORKER_KEY=${CSCAN_WORKER_KEY:?CSCAN_WORKER_KEY must be set}
    volumes:
      - cscan_api_data:/app/data
      - ./log:/app/log
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8888:8888"
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cscan_network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --quiet --tries=1 --spider http://localhost:8888/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # CSCAN Web 服务
  cscan-web:
    image: registry.cn-hangzhou.aliyuncs.com/txf7/cscan-web:latest
    container_name: cscan_web
    logging: *default-logging
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "3000:80"
      - "7777:443"
    volumes:
      - cscan_ssl_certs:/etc/nginx/ssl
    depends_on:
      - cscan-api
    restart: unless-stopped
    networks:
      - cscan_network

  # CSCAN Worker 默认节点
  cscan-worker:
    image: registry.cn-hangzhou.aliyuncs.com/txf7/cscan-worker:latest
    container_name: cscan_worker
    logging: *default-logging
    cap_add:
      - NET_RAW
    environment:
      - TZ=Asia/Shanghai
      - CSCAN_SERVER=http://cscan-api:8888
      - CSCAN_KEY=${CSCAN_WORKER_KEY:?CSCAN_WORKER_KEY must be set}
      - CSCAN_NAME=cscan-default-worker
      - CSCAN_MONGO_URI=mongodb://${CSCAN_MONGO_ROOT_USERNAME:?CSCAN_MONGO_ROOT_USERNAME must be set}:${CSCAN_MONGO_ROOT_PASSWORD:?CSCAN_MONGO_ROOT_PASSWORD must be set}@mongodb:27017/cscan?authSource=admin
      - CSCAN_REDIS_ADDR=redis:6379
      - CSCAN_REDIS_PASSWORD=${CSCAN_REDIS_PASSWORD:?CSCAN_REDIS_PASSWORD must be set}
    depends_on:
      cscan-api:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cscan_network
    volumes:
      - cscan_worker_logs:/app/log
      # 本地模板库持久化（Nuclei 模板 + 自定义 POC 的内容寻址缓存，避免容器重建后重新全量同步）
      - cscan_worker_templates:/app/data/template-store

volumes:
  cscan_redis_data:
    driver: local
  cscan_mongodb_data:
    driver: local
  cscan_ssl_certs:
    driver: local
  cscan_api_data:
    driver: local
  cscan_worker_logs:
    driver: local
  cscan_worker_templates:
    driver: local

networks:
  cscan_network:
    driver: bridge
